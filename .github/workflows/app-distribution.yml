name: Firebase App Distribution

on:
  push:
    branches:
      - main
      - cursor/badminton-type-mapping-e9d5
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Custom release notes (optional)'
        required: false
        type: string
      enable_lift_watch:
        description: 'Enable Fathom Lift watch set-logging (FATHOM_LIFT_WATCH)'
        required: false
        type: boolean
        default: false

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Prepare CI signing keystore
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "❌ ANDROID_KEYSTORE_BASE64 is required for App Distribution signing"
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/fathom-ci.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "FATHOM_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "FATHOM_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FATHOM_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FATHOM_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "✅ CI keystore prepared at runner temp (not logged)"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Create .env file from secrets
        run: |
          # Fail if SENTRY_DSN is missing (required for observability)
          if [ -z "$SENTRY_DSN" ]; then
            echo "❌ ERROR: SENTRY_DSN secret is required but not set"
            echo "   Add it in GitHub Settings → Secrets and variables → Actions"
            echo "   Get the DSN from Sentry project settings"
            exit 1
          fi
          
          # Create .env with all secrets
          echo "SENTRY_DSN=$SENTRY_DSN" > .env
          echo "SENTRY_RAW_WORKOUT_DUMP=true" >> .env
          echo "SENTRY_FORCE=true" >> .env
          
          # Add backend write key if available (optional, for Firebase cloud sync)
          if [ -n "$BACKEND_WRITE_KEY" ]; then
            echo "BACKEND_WRITE_KEY=$BACKEND_WRITE_KEY" >> .env
            echo "✅ Backend sync ENABLED (key: ${#BACKEND_WRITE_KEY} chars)"
          else
            echo "⚠️  Backend sync DISABLED (BACKEND_WRITE_KEY not set - data local-only)"
          fi
          
          echo "✅ Created .env file (DSN: ${#SENTRY_DSN} chars)"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BACKEND_WRITE_KEY: ${{ secrets.BACKEND_WRITE_KEY }}

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK with Sentry
        run: |
          # Set version for Sentry release tracking
          VERSION="0.1.0"
          BUILD_NUMBER="${{ github.run_number }}"

          # Lift watch flag: workflow_dispatch input, or auto-on for the PR #30 branch
          LIFT_WATCH="${{ github.event.inputs.enable_lift_watch }}"
          if [ "$LIFT_WATCH" != "true" ]; then
            if [ "${{ github.ref_name }}" = "cursor/watch-set-logging" ]; then
              LIFT_WATCH=true
            else
              LIFT_WATCH=false
            fi
          fi
          echo "FATHOM_LIFT_WATCH=$LIFT_WATCH"
          echo "LIFT_WATCH=$LIFT_WATCH" >> "$GITHUB_ENV"
          
          # Build release without obfuscation for now (easier debugging)
          # Pass SENTRY_RAW_WORKOUT_DUMP to Android BuildConfig via Gradle property
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define-from-file=.env \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=APP_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=FATHOM_LIFT_WATCH="$LIFT_WATCH" \
            --build-name="${VERSION}+${BUILD_NUMBER}" \
            --build-number="$BUILD_NUMBER" \
            -PSENTRY_RAW_WORKOUT_DUMP=true
          
          echo "✅ Built release APK: com.example.fitness_os@${VERSION}+${BUILD_NUMBER} (FATHOM_LIFT_WATCH=$LIFT_WATCH)"

      - name: Verify APK signing certificate (SHA-256)
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          EXPECTED="51f2a87991953068a5b4995f4ebb2ba55b4d145d04bd72b7a972044945bbc9f3"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(ls -d "$SDK_ROOT/build-tools"/* 2>/dev/null | sort -V | tail -1)"
          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "❌ apksigner not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          CERT_OUT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" 2>&1)"
          ACTUAL="$(echo "$CERT_OUT" | grep -i 'SHA-256' | head -1 | sed -E 's/.*SHA-256[^:]*:[[:space:]]*//; s/://g; s/[^0-9A-Fa-f]//g' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL" ]; then
            echo "❌ Could not parse SHA-256 from apksigner output"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ APK signer SHA-256 mismatch"
            echo "   expected: $EXPECTED"
            echo "   actual:   $ACTUAL"
            echo "   apksigner cert excerpt:"
            echo "$CERT_OUT" | grep -i 'SHA-256' | head -3 || true
            exit 1
          fi
          echo "✅ APK signed with expected SHA-256 digest"

      - name: Prepare release notes
        id: release_notes
        run: |
          BRANCH="${{ github.ref_name }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            NOTES="Branch: ${BRANCH}
          Commit: ${SHORT_SHA}
          
          ${COMMIT_MSG}
          
          🧪 Debug build with:
          - Sentry observability enabled
          - Raw workout payload dumps (SENTRY_RAW_WORKOUT_DUMP=true)
          - Badminton type 129 mapping + racket sport icons
          - FATHOM_LIFT_WATCH=${LIFT_WATCH}
          
          Install via Firebase App Tester app."
          fi
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Release notes prepared for ${BRANCH}@${SHORT_SHA}"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID || '1:842234944328:android:3dc4d51ae03b539827f17d' }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: build/app/outputs/flutter-apk/app-release.apk
          groups: me
          releaseNotes: ${{ steps.release_notes.outputs.notes }}

      - name: Upload APK artifact (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Firebase App Distribution Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK**: app-release.apk (persistent CI release signing)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Install**: Open Firebase App Tester on Pixel → Accept invite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **Features**: Badminton mapping, Sentry observability, raw dumps enabled, FATHOM_LIFT_WATCH=${LIFT_WATCH}" >> $GITHUB_STEP_SUMMARY
