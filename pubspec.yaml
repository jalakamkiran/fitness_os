name: fitness_os
description: "Fathom — swim companion for Huawei GT5."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  blueprint_ui:
    path: packages/blueprint_ui
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  dio: ^5.10.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  flutter_gemma: ^1.0.0-rc.1
  flutter_gemma_litertlm: ^1.0.0-rc.1
  fl_chart: ^1.2.0
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Splash-only Discobolus mark (letter T in wordmark). App icon stays F.
    - assets/brand/discobolus.png
