<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovery — Fathom</title>
  <link rel="stylesheet" href="tokens.css">
</head>
<body>
  <div class="container">
    <div style="padding: 16px; border-bottom: 1px solid var(--line);">
      <h1 class="text-headline-md">Recovery</h1>
    </div>
    
    <div class="screen">
      <div class="pill" style="margin-bottom: 12px;">
        <span class="pill-dot" style="background-color: var(--accent);"></span>
        <span>Synced · TruSleep</span>
      </div>

      <div class="card card-lg">
        <div class="text-label-sm">LAST NIGHT</div>
        <div class="text-display-lg" style="margin-top: 8px;">8h 15m</div>
        <div class="text-body-sm" style="font-family: var(--font-mono); margin-top: 4px;">23:32 — 07:47</div>
        <div style="margin-top: 16px; padding: 12px; background-color: var(--pool); border-radius: var(--radius-sm); display: flex; justify-content: space-between;">
          <span class="text-body-sm"><strong>Sleep Score:</strong> 86</span>
          <span class="text-body-sm"><strong>Week Avg:</strong> 82</span>
        </div>
      </div>

      <div class="card" style="margin-top: 12px;">
        <div class="text-title-sm" style="margin-bottom: 12px;">Contributors</div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
          <div><span class="text-body-sm">Deep sleep: <strong>2h 8m</strong></span></div>
          <div><span class="text-body-sm">Latency: <strong>12m</strong></span></div>
          <div><span class="text-body-sm">HRV: <strong>52ms</strong></span></div>
          <div><span class="text-body-sm">Efficiency: <strong>94%</strong></span></div>
        </div>
      </div>

      <div class="card" style="margin-top: 12px;">
        <div class="text-title-sm" style="margin-bottom: 8px;">Sleep Debt</div>
        <div class="text-body-sm">7-day avg: <strong>7h 52m</strong> (8m below 8h target)</div>
      </div>
    </div>

    <div class="tab-bar">
      <a href="home.html" class="tab-item"><div class="tab-icon">🏠</div><span>Today</span></a>
      <a href="workouts.html" class="tab-item"><div class="tab-icon">💪</div><span>Workouts</span></a>
      <a href="recovery.html" class="tab-item active"><div class="tab-icon">🌙</div><span>Recovery</span></a>
      <a href="food.html" class="tab-item"><div class="tab-icon">🍽️</div><span>Food</span></a>
      <a href="settings.html" class="tab-item"><div class="tab-icon">⋯</div><span>More</span></a>
    </div>
  </div>
</body>
</html>
