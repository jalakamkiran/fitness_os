<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chart samples — Fitness OS research</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1419; color: #e8eef2; }
    header { padding: 20px 24px; border-bottom: 1px solid #243040; }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0; color: #9aadb8; font-size: 14px; }
    .grid { display: grid; gap: 28px; padding: 24px; max-width: 1100px; margin: 0 auto; }
    figure { margin: 0; background: #161c24; border: 1px solid #2a3544; border-radius: 16px; overflow: hidden; }
    figcaption { padding: 12px 16px; font-size: 14px; line-height: 1.4; }
    figcaption strong { display: block; margin-bottom: 4px; }
    img { width: 100%; display: block; background: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Analytics chart samples</h1>
    <p>Research only — not applied to the Fitness OS prototype yet.</p>
  </header>
  <div class="grid">
    <figure>
      <img src="05-apex-line-column.png" alt="Apex dual-axis line and column" />
      <figcaption><strong>1 · Apex dual-axis (line + columns)</strong> Best match for pace/SWOLF + volume. Thin line, markers, second Y-axis.</figcaption>
    </figure>
    <figure>
      <img src="06-apex-brush-detail.png" alt="Apex brush chart" />
      <figcaption><strong>2 · Apex brush / zoom</strong> Detail chart + context strip — good for long swim sets.</figcaption>
    </figure>
    <figure>
      <img src="09-apex-spline-area.png" alt="Apex spline area" />
      <figcaption><strong>3 · Apex spline area (multi-series)</strong> Smooth area fills; note different line weights between series.</figcaption>
    </figure>
    <figure>
      <img src="01-vortex-mixed-dual-axis.png" alt="Vortex mixed charts dashboard" />
      <figcaption><strong>4 · Mixed dashboard gallery</strong> Bar+line, area+line, dashed cumulative — dashboard density reference.</figcaption>
    </figure>
    <figure>
      <img src="04-metricui-area-bands.png" alt="MetricUI area chart" />
      <figcaption><strong>5 · Area + bands language</strong> Clean gradient area; ignore purple — map to mint/amber in our DS.</figcaption>
    </figure>
    <figure>
      <img src="11-trainingpeaks-analyze360.png" alt="TrainingPeaks Analyze 360" />
      <figcaption><strong>6 · TrainingPeaks Analyze 360</strong> Multi-channel endurance analytics mindset (overlay channels, laps).</figcaption>
    </figure>
  </div>
</body>
</html>
