<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fathom Onboarding — Excalidraw Viewer</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa7b8;
      --accent: #5b9fd4;
      --border: #2a3648;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow: auto;
    }
    h1 { font-size: 1rem; margin: 0 0 0.25rem; }
    p { color: var(--muted); font-size: 0.8rem; margin: 0 0 1rem; line-height: 1.4; }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.35rem; }
    select {
      width: 100%;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-bottom: 1rem;
    }
    a.ext {
      display: inline-block;
      color: var(--accent);
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    #status { font-size: 0.75rem; color: var(--muted); min-height: 1.2em; }
    #root { height: 100vh; }
    .hint { font-size: 0.75rem; color: var(--muted); line-height: 1.45; }
  </style>
</head>
<body>
  <aside>
    <h1>Fathom diagrams</h1>
    <p>Loads local <code>.excalidraw</code> scenes with the Excalidraw editor.</p>
    <label for="diagram">Scene</label>
    <select id="diagram"></select>
    <a class="ext" id="openOfficial" href="https://excalidraw.com" target="_blank" rel="noreferrer">
      Open excalidraw.com ↗
    </a>
    <div id="status">Loading editor…</div>
    <p class="hint">
      Tip: File → Save on excalidraw.com also works if you open a file from
      <code>docs/onboarding/diagrams/</code> directly.
    </p>
  </aside>
  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@0.17.6?external=react,react-dom"
    }
  }
  </script>
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.17.6/dist/excalidraw.min.css" />

  <script type="module">
    import React, { useEffect, useState } from "react";
    import { createRoot } from "react-dom/client";
    import { Excalidraw } from "@excalidraw/excalidraw";

    const DIAGRAMS = [
      ["01-hld-system-context.excalidraw", "HLD · System context"],
      ["02-hld-layered-architecture.excalidraw", "HLD · Layered architecture"],
      ["03-hld-feature-module-map.excalidraw", "HLD · Feature module map"],
      ["04-hld-user-journeys-sync-planes.excalidraw", "HLD · Journeys & sync planes"],
      ["05-lld-bootstrap-di.excalidraw", "LLD · Bootstrap & DI"],
      ["06-lld-huawei-native-stack.excalidraw", "LLD · Huawei native stack"],
      ["07-lld-huawei-flutter-bridge.excalidraw", "LLD · Flutter Huawei bridge"],
      ["08-lld-gate-a-pairing.excalidraw", "LLD · Gate A pairing"],
      ["09-lld-sync-pass.excalidraw", "LLD · Sync pass"],
      ["10-lld-feature-internals.excalidraw", "LLD · Feature internals"],
      ["11-lld-persistence-map.excalidraw", "LLD · Persistence map"],
      ["12-lld-navigation-routes.excalidraw", "LLD · Navigation routes"],
    ];

    function App() {
      const [file, setFile] = useState(DIAGRAMS[0][0]);
      const [scene, setScene] = useState(null);
      const [error, setError] = useState("");

      useEffect(() => {
        const sel = document.getElementById("diagram");
        sel.innerHTML = "";
        for (const [name, label] of DIAGRAMS) {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = label;
          sel.appendChild(opt);
        }
        sel.value = file;
        sel.onchange = (e) => setFile(e.target.value);
      }, []);

      useEffect(() => {
        let cancelled = false;
        setScene(null);
        setError("");
        document.getElementById("status").textContent = `Loading ${file}…`;
        fetch(`./diagrams/${file}`)
          .then((r) => {
            if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
            return r.json();
          })
          .then((data) => {
            if (cancelled) return;
            setScene({
              elements: data.elements || [],
              appState: {
                ...(data.appState || {}),
                viewBackgroundColor: data.appState?.viewBackgroundColor || "#ffffff",
              },
              files: data.files || {},
            });
            document.getElementById("status").textContent =
              `${file} · ${(data.elements || []).length} elements`;
          })
          .catch((err) => {
            if (cancelled) return;
            setError(String(err));
            document.getElementById("status").textContent =
              "Serve this folder over HTTP (see README).";
          });
        return () => { cancelled = true; };
      }, [file]);

      if (error) {
        return React.createElement(
          "div",
          { style: { padding: 24, color: "#ffb4b4" } },
          "Could not load diagram. Run: ",
          React.createElement("code", null, "npx --yes serve docs/onboarding -p 5179"),
          " then open this page. Detail: ",
          error,
        );
      }

      if (!scene) {
        return React.createElement("div", { style: { padding: 24 } }, "Loading…");
      }

      return React.createElement(
        "div",
        { style: { height: "100vh" } },
        React.createElement(Excalidraw, {
          key: file,
          initialData: scene,
          UIOptions: { canvasActions: { loadScene: true, saveToActiveFile: true } },
        }),
      );
    }

    createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
